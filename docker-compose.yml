# docker compose up -d, then open http://localhost:8788 and follow the page.
# Settings are made on the page; a .env file is optional (see .env.example) and its values win over the page.
services:
  liquidator:
    image: ghcr.io/nodecattel/netnetintel-liquidator:latest
    # build: .              # or build from this folder
    container_name: netnet-liq
    labels: { org.netnetintel.liquidator: "1" }   # the start command finds (and replaces) it by this
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"   # this computer only: don't drop the 127.0.0.1
    # env_file: .env
    volumes:
      - liq-data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  liq-data:
